[package]
name = "gradient-codec"
version = "0.1.0"
edition = "2021"
	license-file = "LICENSE"
description = "Budget-aware multi-model orchestration runtime with reproducible traces and cross-model failure critique"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
gradient-plane = { path = "plane" }

[dev-dependencies]
tokio-test = "0.4"
mockito = "1.5"

[[bin]]
name = "gradient-codec"
path = "src/main.rs"

[workspace]
members = [".", "vecGradient", "plane"]
resolver = "2"

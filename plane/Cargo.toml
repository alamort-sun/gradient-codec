[package]
name = "gradient-plane"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
description = "Saraswati A2 plane-safe newtypes (LeaseId, ActDigest, siblings) — join inexpressible by construction"
repository = "https://github.com/alamort-sun/gradient-codec"

[features]
default = []
# Optional: SpacetimeDB column derive for gradient-space-time tables/reducers.
# Not on by default — keeps router/wasm geometry free of a spacetimedb dep (Luna splice lesson).
spacetimedb = ["dep:spacetimedb"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
spacetimedb = { version = "1", optional = true }
